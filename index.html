<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awareness & Support Camp — Field Impact Report 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/dflip@1.3.1/css/dflip.min.css" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/dflip@1.3.1/css/themify-icons.min.css" rel="stylesheet" type="text/css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background-color: #1a1a1a; }
    #flipbook-container { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="flipbook-container"></div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dflip@1.3.1/js/dflip.min.js" type="text/javascript"></script>
  <script>
    jQuery(document).ready(function ($) {
      $("#flipbook-container").flipBook("Report.pdf", {
        webgl: true,
        height: '100%',
        duration: 800,
        soundEnable: true,
        enableDownload: true,
        backgroundColor: "#1a1a1a"
      });
    });
  </script>
</body>
</html>
