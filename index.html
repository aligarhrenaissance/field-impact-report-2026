<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awareness & Support Camp — Field Impact Report 2026 | The Aligarh Renaissance</title>
  
  <!-- FontAwesome & dFlip CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/dflip@1.3.1/css/dflip.min.css" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/dflip@1.3.1/css/themify-icons.min.css" rel="stylesheet" type="text/css">
  
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; overflow: hidden; }
    
    .top-bar { 
      height: 55px; 
      background: rgba(15, 23, 42, 0.95); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0 20px; 
      color: #fff; 
      border-bottom: 1px solid rgba(255,255,255,0.1); 
      z-index: 9999; 
    }
    .title { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .badge { background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; margin-left: 8px; }
    .social-share { display: flex; align-items: center; gap: 10px; }
    .social-btn { color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; }
    .social-btn.wa { background: #25D366; }
    .social-btn.li { background: #0A66C2; }
    .social-btn.copy { background: #475569; cursor: pointer; }
    
    #flipbook-container { height: calc(100vh - 55px); width: 100vw; }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="top-bar">
    <div>
      <span class="title">THE ALIGARH RENAISSANCE</span>
      <span class="badge">Impact Report 2026</span>
    </div>
    <div class="social-share">
      <a href="https://api.whatsapp.com/send?text=Check%20out%20our%20Report:%20https://aligarhrenaissance.github.io/field-impact-report-2026/" target="_blank" class="social-btn wa" title="Share on WhatsApp"><i class="fab fa-whatsapp"></i></a>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://aligarhrenaissance.github.io/field-impact-report-2026/" target="_blank" class="social-btn li" title="Share on LinkedIn"><i class="fab fa-linkedin-in"></i></a>
      <div class="social-btn copy" onclick="navigator.clipboard.writeText(window.location.href); alert('Link Copied!');" title="Copy Link"><i class="fas fa-link"></i></div>
    </div>
  </div>

  <!-- Flipbook Container Class-based Definition -->
  <div id="flipbook-container" class="_df_book" source="Report.pdf"></div>

  <!-- jQuery & dFlip Engine Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dflip@1.3.1/js/dflip.min.js" type="text/javascript"></script>

  <script>
    // Global Configuration Settings for dFlip
    var option_flipbook-container = {
      webgl: false,
      height: '100%',
      duration: 700,
      soundEnable: true,
      enableDownload: true,
      enablePrint: true,
      backgroundColor: "#0f172a"
    };
  </script>

</body>
</html>
