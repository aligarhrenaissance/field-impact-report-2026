<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awareness & Support Camp — Field Impact Report 2026 | The Aligarh Renaissance</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #fff; overflow: hidden; }

    /* Top Bar */
    .top-bar {
      height: 55px;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: relative;
      z-index: 10;
    }
    .title { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .badge { background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; margin-left: 8px; }

    /* Controls Toolbar */
    .controls { display: flex; align-items: center; gap: 12px; }
    .btn { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .btn:hover { background: #0284c7; }
    .page-info { font-size: 13px; color: #94a3b8; }

    /* Social Icons */
    .social-share { display: flex; align-items: center; gap: 8px; }
    .social-btn { color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; }
    .social-btn.wa { background: #25D366; }
    .social-btn.li { background: #0A66C2; }
    .social-btn.copy { background: #475569; cursor: pointer; }

    /* PDF Viewer Container */
    #pdf-container {
      height: calc(100vh - 55px);
      width: 100vw;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background: #0f172a;
    }
    canvas {
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 4px;
      max-width: 100%;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <span class="title">THE ALIGARH RENAISSANCE</span>
      <span class="badge">Impact Report 2026</span>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
      <button class="btn" id="prev"><i class="fas fa-chevron-left"></i> Prev</button>
      <span class="page-info">Page <span id="page-num">1</span> / <span id="page-count">-</span></span>
      <button class="btn" id="next">Next <i class="fas fa-chevron-right"></i></button>
      <button class="btn" id="zoom-in"><i class="fas fa-search-plus"></i></button>
      <button class="btn" id="zoom-out"><i class="fas fa-search-minus"></i></button>
      <a href="Report.pdf" download class="btn"><i class="fas fa-download"></i> Download</a>
    </div>

    <!-- Social Share -->
    <div class="social-share">
      <a href="https://api.whatsapp.com/send?text=Check%20out%20our%20Report:%20https://aligarhrenaissance.github.io/field-impact-report-2026/" target="_blank" class="social-btn wa"><i class="fab fa-whatsapp"></i></a>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://aligarhrenaissance.github.io/field-impact-report-2026/" target="_blank" class="social-btn li"><i class="fab fa-linkedin-in"></i></a>
      <div class="social-btn copy" onclick="navigator.clipboard.writeText(window.location.href); alert('Link Copied!');"><i class="fas fa-link"></i></div>
    </div>
  </div>

  <div id="pdf-container">
    <canvas id="pdf-render"></canvas>
  </div>

  <script>
    const url = 'Report.pdf';

    let pdfDoc = null,
        pageNum = 1,
        pageIsRendering = false,
        pageNumIsPending = null,
        scale = 1.3,
        canvas = document.getElementById('pdf-render'),
        ctx = canvas.getContext('2d');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Render Page
    const renderPage = num => {
      pageIsRendering = true;

      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderCtx = {
          canvasContext: ctx,
          viewport
        };

        page.render(renderCtx).promise.then(() => {
          pageIsRendering = false;

          if (pageNumIsPending !== null) {
            renderPage(pageNumIsPending);
            pageNumIsPending = null;
          }
        });

        document.getElementById('page-num').textContent = num;
      });
    };

    const queueRenderPage = num => {
      if (pageIsRendering) {
        pageNumIsPending = num;
      } else {
        renderPage(num);
      }
    };

    // Show Prev Page
    document.getElementById('prev').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    // Show Next Page
    document.getElementById('next').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    // Zoom
    document.getElementById('zoom-in').addEventListener('click', () => {
      scale += 0.2;
      queueRenderPage(pageNum);
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
      if (scale <= 0.8) return;
      scale -= 0.2;
      queueRenderPage(pageNum);
    });

    // Get Document
    pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
      pdfDoc = pdfDoc_;
      document.getElementById('page-count').textContent = pdfDoc.numPages;
      renderPage(pageNum);
    }).catch(err => {
      const div = document.createElement('div');
      div.className = 'error';
      div.appendChild(document.createTextNode("Error loading PDF: " + err.message));
      document.getElementById('pdf-container').appendChild(div);
    });
  </script>

</body>
</html>
