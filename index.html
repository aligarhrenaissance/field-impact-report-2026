<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awareness & Support Camp — Field Impact Report 2026 | The Aligarh Renaissance</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0b1329; color: #fff; overflow: hidden; }

    /* Top Bar */
    .top-bar {
      height: 60px;
      background: rgba(11, 19, 41, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .title { font-size: 15px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px; }
    .badge { background: #0284c7; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }

    /* Controls Toolbar */
    .controls { display: flex; align-items: center; gap: 10px; }
    .btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .btn:hover { background: #0284c7; color: #fff; border-color: #0284c7; }
    .page-info { font-size: 13px; color: #94a3b8; font-weight: 600; padding: 0 6px; }

    /* Social Icons */
    .social-share { display: flex; align-items: center; gap: 8px; }
    .social-btn { color: #fff; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; transition: transform 0.2s; }
    .social-btn:hover { transform: scale(1.1); }
    .social-btn.wa { background: #25D366; }
    .social-btn.li { background: #0A66C2; }
    .social-btn.copy { background: #475569; cursor: pointer; }

    /* Main Container Layout */
    .main-wrapper { display: flex; height: calc(100vh - 60px); width: 100vw; position: relative; }

    /* Collapsible Index Sidebar */
    .sidebar {
      width: 260px;
      background: #0f172a;
      border-right: 1px solid rgba(255,255,255,0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      transition: all 0.3s ease;
    }
    .sidebar-title { font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
    .toc-item { font-size: 13px; color: #cbd5e1; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .toc-item:hover { background: #1e293b; color: #38bdf8; }

    /* PDF Viewer Container */
    #pdf-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #0b1329;
    }
    .canvas-wrapper { display: flex; gap: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden; }
    canvas { background: #fff; display: block; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand">
      <span class="title">THE ALIGARH RENAISSANCE</span>
      <span class="badge">Impact Report 2026</span>
    </div>

    <!-- Navigation & Display Controls -->
    <div class="controls">
      <button class="btn" id="prev"><i class="fas fa-chevron-left"></i> Prev</button>
      <span class="page-info">Page <span id="page-num">1</span> / <span id="page-count">-</span></span>
      <button class="btn" id="next">Next <i class="fas fa-chevron-right"></i></button>
      <button class="btn" id="toggle-view" title="Toggle Single / Two-Page Spread"><i class="fas fa-book-open"></i> View</button>
      <button class="btn" id="zoom-in"><i class="fas fa-search-plus"></i></button>
      <button class="btn" id="zoom-out"><i class="fas fa-search-minus"></i></button>
      <a href="Report.pdf" download class="btn"><i class="fas fa-download"></i> Download</a>
    </div>

    <!-- Social Share -->
    <div class="social-share">
      <a href="https://api.whatsapp.com/send?text=Check%20out%20our%20Report:%20https://aligarhrenaissance.github.io/field-impact-report-2026/" target="_blank" class="social-btn wa"><i class="fab fa-whatsapp"></i></a>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://aligarhrenaissance.github.io/field-impact-report-2026/" target="_blank" class="social-btn li"><i class="fab fa-linkedin-in"></i></a>
      <div class="social-btn copy" onclick="navigator.clipboard.writeText(window.location.href); alert('Link Copied!');"><i class="fas fa-link"></i></div>
    </div>
  </div>

  <div class="main-wrapper">
    <!-- Sidebar Navigation -->
    <div class="sidebar">
      <div class="sidebar-title">Quick Index</div>
      <div class="toc-item" onclick="goToPage(1)">1. Title & Cover Page</div>
      <div class="toc-item" onclick="goToPage(2)">2. Table of Contents</div>
      <div class="toc-item" onclick="goToPage(3)">3. Executive Summary & Profile</div>
      <div class="toc-item" onclick="goToPage(5)">4. Government Data Context</div>
      <div class="toc-item" onclick="goToPage(7)">5. Quantitative Survey Data</div>
      <div class="toc-item" onclick="goToPage(8)">6. UN SDG Alignment</div>
      <div class="toc-item" onclick="goToPage(10)">7. Next Action Items</div>
    </div>

    <!-- Canvas Rendering Area -->
    <div id="pdf-container">
      <div class="canvas-wrapper">
        <canvas id="pdf-render-left"></canvas>
        <canvas id="pdf-render-right" style="display: none;"></canvas>
      </div>
    </div>
  </div>

  <!-- Page Flip Sound Effect -->
  <audio id="flip-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>

  <script>
    const url = 'Report.pdf';
    let pdfDoc = null,
        pageNum = 1,
        scale = 1.1,
        isTwoPage = false,
        canvasLeft = document.getElementById('pdf-render-left'),
        canvasRight = document.getElementById('pdf-render-right'),
        ctxLeft = canvasLeft.getContext('2d'),
        ctxRight = canvasRight.getContext('2d'),
        flipSound = document.getElementById('flip-sound');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    function playSound() {
      flipSound.currentTime = 0;
      flipSound.play().catch(() => {});
    }

    const renderSinglePage = (num, canvas, ctx) => {
      return pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        return page.render({ canvasContext: ctx, viewport }).promise;
      });
    };

    const renderPages = () => {
      renderSinglePage(pageNum, canvasLeft, ctxLeft);
      
      if (isTwoPage && (pageNum + 1 <= pdfDoc.numPages)) {
        canvasRight.style.display = 'block';
        renderSinglePage(pageNum + 1, canvasRight, ctxRight);
      } else {
        canvasRight.style.display = 'none';
      }

      document.getElementById('page-num').textContent = isTwoPage && (pageNum + 1 <= pdfDoc.numPages) ? `${pageNum}-${pageNum+1}` : pageNum;
    };

    function goToPage(num) {
      pageNum = num;
      playSound();
      renderPages();
    }

    document.getElementById('prev').addEventListener('click', () => {
      let step = isTwoPage ? 2 : 1;
      if (pageNum <= 1) return;
      pageNum = Math.max(1, pageNum - step);
      playSound();
      renderPages();
    });

    document.getElementById('next').addEventListener('click', () => {
      let step = isTwoPage ? 2 : 1;
      if (pageNum >= pdfDoc.numPages) return;
      pageNum = Math.min(pdfDoc.numPages, pageNum + step);
      playSound();
      renderPages();
    });

    document.getElementById('toggle-view').addEventListener('click', () => {
      isTwoPage = !isTwoPage;
      renderPages();
    });

    document.getElementById('zoom-in').addEventListener('click', () => {
      scale += 0.15;
      renderPages();
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      if (scale <= 0.6) return;
      scale -= 0.15;
      renderPages();
    });

    pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
      pdfDoc = pdfDoc_;
      document.getElementById('page-count').textContent = pdfDoc.numPages;
      renderPages();
    });
  </script>

</body>
</html>
